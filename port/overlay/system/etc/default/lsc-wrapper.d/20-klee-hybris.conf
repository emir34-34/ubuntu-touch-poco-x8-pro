# klee: libhybris has no linker config on this port, its default search path
# (/system/lib64:/odm/lib64:/vendor/lib64) misses the Android 16 vendor's
# mapper (/vendor/lib64/hw/mapper.mediatek.so) and the Mali EGL helpers
# (/vendor/lib64/egl/libMEOW_*.so).
export HYBRIS_LD_LIBRARY_PATH=/system/lib64:/odm/lib64:/vendor/lib64:/odm/lib64/hw:/vendor/lib64/hw:/vendor/lib64/egl
